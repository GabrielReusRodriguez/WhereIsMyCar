services:
  app:
    build:
      context: .
      target: dev
    working_dir: /app
    command: npm run dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true

  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    user: "0:0"
    working_dir: /app
    volumes:
      - .:/app
      - node_modules_e2e:/app/node_modules
    environment:
      - CI=1
    command: sh -c "npm ci && npm run test:e2e"

  preview:
    build:
      context: .
      target: dev
    working_dir: /app
    command: npm run preview -- --port 4173
    ports:
      - "4173:4173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
  node_modules_e2e:
